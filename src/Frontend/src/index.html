<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Rotina do Bebê — App PWA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <script>
    try {
      const savedScheme = localStorage.getItem("color-scheme") || "light";
      document.querySelector('meta[name="color-scheme"]').content = savedScheme;
      document.querySelector('meta[name="theme-color"]').content = savedScheme === "dark" ? "#0A0B0E" : "#FAF7F2";
    } catch (_) {}
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
</body>
</html>
