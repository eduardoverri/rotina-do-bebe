services:
  mongodb:
    image: mongo:8.0
    container_name: babyroutine-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  babyroutine-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: babyroutine-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - MongoDb__DatabaseName=baby_routine_db
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
