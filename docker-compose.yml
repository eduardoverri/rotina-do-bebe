services:
  mongodb:
    image: mongo:8.0
    container_name: babyroutine-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend-api:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: babyroutine-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - MongoDb__DatabaseName=baby_routine_db
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
